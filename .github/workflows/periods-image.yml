name: Periods image

on:
  push:
    tags: ['v*-periods.*']

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/actual-server:${{ github.ref_name }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/setup
        with:
          cache: 'false'
      - run: yarn typecheck
      - run: yarn lint
      - run: yarn workspace @actual-app/core test
      - run: yarn workspace @actual-app/web test
      - run: yarn build:server
      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Build voor smoketest
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: packages/sync-server/docker/alpine.Dockerfile
          platforms: linux/amd64
          load: true
          tags: actual-periods-test
      - name: Smoketest, de image moet booten
        timeout-minutes: 2
        run: |
          docker run --detach --network=host --name actual-server actual-periods-test
          until docker exec actual-server sh -c 'node scripts/health-check.js'; do sleep 2; done
      - uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: packages/sync-server/docker/alpine.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}
